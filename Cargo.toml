[package]
name = "ubdmf"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
gui = ["raylib", "clay-layout"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
clay-layout = { version = "0.4.0", optional = true }
raylib = { version = "6.0.0", optional = true, features = ["log"] }
log = { version = "0.4.35", features = ["alloc", "std"] }
nusb = "0.2.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "2", features = ["json"] }
zip = { version = "9.8.0", default-features = false, features = ["deflate"] }
indicatif = "0.18.6"

[build-dependencies]
winresource = "0.1"
