[package]
name = "ubmdf"
version = "1.0.2"
edition = "2024"

[features]
default = ["gui"]
gui = ["raylib", "clay-layout"]
# Embed every flashable bundle (needs the LFS images checked out); release builds enable it.
bundled-firmware = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
clay-layout = { version = "0.4.0", optional = true }
raylib = { version = "6.0.0", optional = true, features = ["log"] }
log = { version = "0.4.35", features = ["alloc", "std"] }
nusb = "0.2.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "2", features = ["json"] }
zip = { version = "9.8.0", default-features = false, features = ["deflate"] }
indicatif = "0.18.6"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
winresource = "0.1"
sha2 = "0.11.1"
zip = { version = "9.8.0", default-features = false, features = ["deflate"] }

# android/ = the Android app (cdylib). Plain `cargo build` at the root still
# builds only the desktop package.
[workspace]
members = [".", "android"]
default-members = ["."]
