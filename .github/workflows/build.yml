name: build

# Cross-platform GUI builds:
#   Windows  -> ubmdf-windows-x64.exe  (GUI subsystem, icon embedded via build.rs)
#   Linux    -> UBMDF-x86_64.AppImage  (built on Ubuntu 22.04 for an older glibc baseline)
#   macOS    -> UBMDF-macos-universal.zip (UBMDF.app, arm64 + x86_64 lipo'd)
# Every job runs the tests and a CLI smoke test of the built binary.
# Release builds embed every flashable bundle (feature bundled-firmware); only
# those images (~30 MB) are fetched from Git LFS, cached between runs.
# Tag a commit "v*" to also publish the artifacts as a GitHub release.

on:
  push:
    branches: [master, gui-clay]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: List bundled-firmware LFS objects
        shell: bash
        run: git lfs ls-files -l -I "firmware/*/dv-*/**" -X "firmware/installers/**" | cut -d' ' -f1 | sort > .lfs-bundle-oids
      - uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-bundles-${{ hashFiles('.lfs-bundle-oids') }}
      - name: Fetch bundled-firmware images (Git LFS, ~30 MB)
        shell: bash
        run: git lfs pull --include="firmware/*/dv-*/**" --exclude="firmware/installers/**"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --features bundled-firmware
      - name: Build (GUI)
        run: cargo build --release --features bundled-firmware
      - name: Smoke test
        shell: bash
        run: |
          ./target/release/ubmdf.exe --version
          ./target/release/ubmdf.exe --help | head -5
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp target/release/ubmdf.exe out/ubmdf-windows-x64.exe
      - uses: actions/upload-artifact@v7
        with:
          name: ubmdf-windows-x64
          path: out/ubmdf-windows-x64.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: List bundled-firmware LFS objects
        shell: bash
        run: git lfs ls-files -l -I "firmware/*/dv-*/**" -X "firmware/installers/**" | cut -d' ' -f1 | sort > .lfs-bundle-oids
      - uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-bundles-${{ hashFiles('.lfs-bundle-oids') }}
      - name: Fetch bundled-firmware images (Git LFS, ~30 MB)
        shell: bash
        run: git lfs pull --include="firmware/*/dv-*/**" --exclude="firmware/installers/**"
      - name: System libraries (raylib / GLFW)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev file desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --features bundled-firmware
      - name: Build (GUI)
        run: cargo build --release --features bundled-firmware
      - name: Smoke test
        run: |
          ./target/release/ubmdf --version
          ./target/release/ubmdf --help | head -5
      - name: AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp target/release/ubmdf AppDir/usr/bin/
          cp assets/icon/ubmdf.png AppDir/usr/share/icons/hicolor/512x512/apps/ubmdf.png
          cat > AppDir/usr/share/applications/ubmdf.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=UBMDF
          Comment=Universal Blackmagic Devices Flasher
          Exec=ubmdf
          Icon=ubmdf
          Categories=Utility;
          Terminal=false
          EOF
          desktop-file-validate AppDir/usr/share/applications/ubmdf.desktop
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          OUTPUT=UBMDF-x86_64.AppImage ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/ubmdf.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/ubmdf.png \
            --output appimage
          file UBMDF-x86_64.AppImage
          ./UBMDF-x86_64.AppImage --appimage-extract-and-run --version
      - uses: actions/upload-artifact@v7
        with:
          name: ubmdf-linux-x86_64-appimage
          path: UBMDF-x86_64.AppImage

  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - name: List bundled-firmware LFS objects
        shell: bash
        run: git lfs ls-files -l -I "firmware/*/dv-*/**" -X "firmware/installers/**" | cut -d' ' -f1 | sort > .lfs-bundle-oids
      - uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-bundles-${{ hashFiles('.lfs-bundle-oids') }}
      - name: Fetch bundled-firmware images (Git LFS, ~30 MB)
        shell: bash
        run: git lfs pull --include="firmware/*/dv-*/**" --exclude="firmware/installers/**"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test (native arm64)
        run: cargo test --release --features bundled-firmware
      - name: Build arm64
        run: cargo build --release --features bundled-firmware --target aarch64-apple-darwin
      - name: Build x86_64
        run: cargo build --release --features bundled-firmware --target x86_64-apple-darwin
      - name: Universal binary
        run: |
          mkdir -p out
          lipo -create -output out/ubmdf \
            target/aarch64-apple-darwin/release/ubmdf \
            target/x86_64-apple-darwin/release/ubmdf
          lipo -info out/ubmdf
          ./out/ubmdf --version
          arch -x86_64 ./out/ubmdf --version || echo "x86_64 slice not runnable here (no Rosetta) - lipo -info above confirms it"
      - name: App bundle
        run: |
          APP=out/UBMDF.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp out/ubmdf "$APP/Contents/MacOS/ubmdf"
          # .icns from the 512 px PNG
          ICONSET=out/ubmdf.iconset; mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon/ubmdf.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d assets/icon/ubmdf.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/ubmdf.icns"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>UBMDF</string>
            <key>CFBundleDisplayName</key><string>UBMDF</string>
            <key>CFBundleIdentifier</key><string>io.github.ubmdf</string>
            <key>CFBundleExecutable</key><string>ubmdf</string>
            <key>CFBundleIconFile</key><string>ubmdf.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          plutil -lint "$APP/Contents/Info.plist"
          # ad-hoc signature so Apple Silicon will launch it (not notarized)
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          ditto -c -k --keepParent "$APP" out/UBMDF-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ubmdf-macos-universal
          path: out/UBMDF-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
